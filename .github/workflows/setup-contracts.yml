name: Compiler setup contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check compiler admission and failed-build launcher contracts
        run: python3 -m unittest discover -s tests -p test_setup.py -v
